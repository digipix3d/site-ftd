services:
  web:
    # A imagem é construída pelo GitHub Actions e publicada no GHCR; a VPS só
    # baixa. TAG é o SHA do commit, o que torna o rollback trivial:
    #   TAG=<sha-anterior> docker compose up -d
    image: ghcr.io/digipix3d/site-ftd:${TAG:-latest}
    # Mantido para desenvolvimento local: `docker compose build` continua
    # funcionando sem depender do registry.
    build: .
    restart: unless-stopped
    environment:
      IG_TOKEN: ${IG_TOKEN:-}
      IG_USER_ID: ${IG_USER_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - dados:/data
    expose:
      - "3000"
    networks: [interna]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMINIO: ${DOMINIO:-fabricadetrecos.com.br}
      EMAIL_TLS: ${EMAIL_TLS:-contato@fabricadetrecos.com.br}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data      # certificados — NÃO apague, Let's Encrypt tem limite de emissão
      - caddy_config:/config
    depends_on:
      - web
    networks: [interna]

volumes:
  dados:
  caddy_dados:
  caddy_config:

networks:
  interna:
